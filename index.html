<style>
  :root{
    --bg:#f3f5f1; --card:#fff; --ink:#1c2420; --sub:#6c756f; --line:#e6e9e3;
    --minus:#d2453b; --plus:#1d8455; --accent:#2c6a4b; --accent2:#e6f0ea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;padding:14px 16px 0}
  header h1{margin:0 0 8px;font-size:18px;font-weight:700}
  nav{display:flex}
  nav button{flex:1;background:none;border:0;color:#bcd6c6;font-size:15px;padding:10px 0 12px;border-bottom:3px solid transparent}
  nav button.on{color:#fff;font-weight:700;border-color:#fff}
  main{max-width:560px;margin:0 auto;padding:12px 12px 40px}
  .card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--accent)}
  .stats{display:flex;gap:10px}
  .stat{flex:1;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .stat .l{font-size:12px;color:var(--sub)}
  .stat .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .list .row{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .list .row:last-child{border-bottom:0}
  .name{font-size:17px;font-weight:600}
  .amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .amt small{display:block;font-size:11px;font-weight:500;margin-top:1px}
  .minus{color:var(--minus)} .plus{color:var(--plus)} .zero{color:var(--sub)}
  .muted{color:var(--sub);font-size:13px}
  .meet .top{display:flex;justify-content:space-between;align-items:baseline}
  .meet .date{font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--accent2);color:var(--accent);border-radius:20px;padding:4px 10px;font-size:13px}
  label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  input,select{width:100%;font-size:16px;padding:11px 12px;border:1px solid #d5dad3;border-radius:10px;background:#fff;color:var(--ink)}
  .btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
  .btn.sub{background:var(--accent2);color:var(--accent)}
  .btn:disabled{opacity:.5}
  .mini{border:0;background:none;color:var(--minus);font-size:13px;padding:6px}
  .mini.g{color:var(--accent)}
  .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .checks label{margin:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border:1px solid #d5dad3;border-radius:10px;color:var(--ink);font-size:15px;user-select:none}
  .checks input{display:none}
  .checks label.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .preview{margin-top:10px;padding:10px 12px;background:var(--accent2);border-radius:10px;font-size:14px;color:var(--accent)}
  .inline{display:flex;gap:8px}
  .inline>*{flex:1}
  .hist .row{cursor:default}
  .hero{background:linear-gradient(135deg,#2c6a4b,#3f8a63);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .hero .chips{gap:5px;margin-top:6px}
  .hero .lbl{font-size:11px;opacity:.85;display:flex;justify-content:space-between;align-items:center}
  .dday{background:#fff;color:var(--accent);font-weight:800;font-size:12px;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .htop{display:flex;justify-content:space-between;align-items:center}

  .sdate{font-weight:700;min-width:78px}
  .sinfo{flex:1;font-size:14px;color:var(--ink)}

  .sec{font-size:13px;color:var(--sub);margin:16px 4px 8px;font-weight:600}

  .chip.prepaid{background:#e6eefb;color:#2f5fb3}

  .vote.onhero{border-top-color:rgba(255,255,255,.25);margin-top:12px}
  .vhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--accent)}
  .vhead span{font-weight:500;color:var(--sub)}
  .onhero .vhead,.onhero .vhead span{color:#fff}
  .vnames{font-size:14px;margin-top:6px}
  .vnames.dim{opacity:.6}
  .vbtns{display:flex;gap:8px;margin-top:10px}
  .vb{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);font-size:15px;font-weight:700}
  .vb.no{border-color:#c9cfc8;color:var(--sub)}
  .vb.on{background:var(--accent);color:#fff}
  .vb.no.on{background:#8a918c;border-color:#8a918c;color:#fff}
  .vb.wide{width:100%;margin-top:10px;flex:none}
  .onhero .vb{border-color:#fff}
  .onhero .vb.on{background:#fff;color:var(--accent)}
  .onhero .vb.no.on{background:rgba(255,255,255,.35);color:#fff;border-color:#fff}
  .vme{font-size:12px;margin-top:6px;color:var(--sub)}
  .onhero .vme,.onhero .vme .linkbtn{color:#fff;opacity:.85}
  .hero[data-goto]{cursor:pointer}
  .card.meet{transition:box-shadow .3s}
  .card.flash{box-shadow:0 0 0 3px var(--accent)}
  .ptop{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
  .ptop b{font-size:22px;color:var(--minus)}
  .pwait,.wait{color:#b7791f}
  .pwait{background:#fdf6e3;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
  .pbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .pb{flex:1 1 30%;text-align:center;text-decoration:none;padding:11px 6px;border-radius:10px;border:1px solid #d5dad3;background:#fff;color:var(--ink);font-size:14px;font-weight:600}
  .pb.toss{background:#3182f6;border-color:#3182f6;color:#fff}
  .pb.kbank{background:#ffe300;border-color:#ffe300;color:#191919}
  .pb.kakao{background:#191919;border-color:#191919;color:#fee500}
  .chip.reported{background:#fdf6e3;color:#b7791f}
  .hchip.wait{background:#fdf6e3;border-color:#fdf6e3;color:#b7791f}
  .card.attn{box-shadow:0 0 0 2px #f0c36d}
  .rcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .paybtn{border:0;background:var(--minus);color:#fff;font-size:12px;font-weight:700;border-radius:14px;padding:5px 11px}
  .paytag{font-size:11px;color:#b7791f;font-weight:600;border:0;background:none;padding:2px 0}
  .hlegend{font-size:10.5px;opacity:.85;margin-top:5px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
  .lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:5px;vertical-align:-1px}
  .lg:first-child{margin-left:0}
  .lg.pre{background:#dce8fb}.lg.ok{background:#fff}.lg.wait{background:#fdf6e3}.lg.no{border:1px solid rgba(255,255,255,.8)}
  .rvote{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .vcnt{font-size:12px;color:var(--sub);margin-right:2px}
  .rvb{border:1.5px solid var(--accent);background:#fff;color:var(--accent);border-radius:14px;padding:4px 10px;font-size:12.5px;font-weight:700}
  .rvb.no{border-color:#c9cfc8;color:var(--sub)}
  .rvb.on{background:var(--accent);color:#fff}
  .rvb.no.on{background:#8a918c;border-color:#8a918c;color:#fff}
  .lowtag{font-size:11px;font-weight:700;color:#fff;background:#e07b24;border-radius:10px;padding:2px 8px}
  .calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .calhead b{font-size:16px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cw{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
  .cd{min-height:44px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:3px;font-size:13px}
  .cd .dn{line-height:18px;height:18px}
  .cd.has{background:var(--accent2);cursor:pointer}
  .cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .cd.pick{background:var(--accent);color:#fff}
  .cd.pick .cm{box-shadow:0 0 0 1px #fff}
  .sun .dn,.cw.sun{color:#d2453b}.sat .dn,.cw.sat{color:#2f5fb3}
  .cd.pick .dn{color:#fff}
  .cm{display:inline-flex;align-items:center;justify-content:center;gap:1px;height:16px;min-width:16px;box-sizing:border-box;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;line-height:1}
  .cm.vt{font-size:9.5px}
  .cm.lg-blank{min-width:12px;width:12px;height:12px;padding:0;border-radius:50%}
  .cm.ok{background:#1d8455;color:#fff}.cm.due{background:#d2453b;color:#fff}.cm.vt{background:#fff;color:var(--sub);border:1px solid #d5dad3}
  .callegend{display:flex;gap:6px;align-items:center;justify-content:center;font-size:11px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
  .callegend .cm{margin-left:4px}
  header::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:0;background:#bfe3cd;opacity:0}
  body.busy header::after{opacity:1;animation:loadbar 1.1s ease-in-out infinite}
  @keyframes loadbar{0%{left:0;width:0}50%{left:15%;width:60%}100%{left:100%;width:0}}
  #a2hs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;background:#1f2a24;color:#fff;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #a2hs .a2ico{flex:0 0 36px;height:36px;border-radius:9px;background:url(apple-touch-icon.png) center/cover,#2c6a4b}
  #a2hs .a2t{flex:1}
  #a2hs .a2x{border:0;background:none;color:#fff;opacity:.7;font-size:16px;padding:4px 6px}
  #a2hs .a2go{margin-top:6px;border:0;background:#d7f05a;color:#1f2a24;font-weight:700;border-radius:8px;padding:6px 12px}
  .actions{display:flex;gap:2px;align-items:center}
  #toast{z-index:100;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90%}
  #toast.show{opacity:1}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
  #modal.show{display:flex}
  #modal .sheet{background:var(--bg);width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 12px 30px}
  #modal .head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px}
  #modal .head b{font-size:18px}
  .loading{text-align:center;color:var(--sub);padding:40px 0}
  .linkbtn{background:none;border:0;color:var(--accent);font-size:13px;padding:0}
</style>
</head>
<body>
<header>
  <h1>🎾 테니스 대관료</h1>
  <nav>
    <button data-tab="status" class="on">현황</button>
    <button data-tab="meetings">일정</button>
    <button data-tab="monthly">월별</button>
    <button data-tab="admin">관리</button>
  </nav>
</header>
<main id="app"><div class="loading">불러오는 중…</div></main>

<div id="modal"><div class="sheet" id="modalBody"></div></div>
<div id="toast"></div>

<script>window.__API_URL__ = "https://script.google.com/macros/s/AKfycbyarQtF4An995JwVRK9sMoBKW81xiXv_7YhHiS79_puJfFaYJ0ljd4mH2ZHcL8tvpyDVA/exec";</script>
<script>
  // 오류가 나면 빈 화면 대신 내용을 보여줌
  function showFatal(msg) {
    const el = document.getElementById('app');
    if (!el) return;
    el.innerHTML = `<div class="card"><b>화면을 그리다 오류가 났어요</b>
      <div class="muted" style="margin:8px 0;word-break:break-all">${String(msg).replace(/[<>&]/g, '')}</div>
      <button class="btn" onclick="try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('tennis_summary')===0)localStorage.removeItem(k)})}catch(e){};location.reload()">다시 불러오기</button></div>`;
  }
  // 화면이 한 번이라도 그려졌으면 오류가 나도 화면을 지우지 않음
  let RENDERED = false;
  window.addEventListener('error', e => {
    const msg = e.message || '';
    // 브라우저(공유 시트·미리보기·확장 프로그램)에서 난 외부 오류는 내용이 없음 → 무시
    if (!e.filename || /^Script error/i.test(msg)) return;
    if (RENDERED) { try { console.warn('[테니스] 오류', msg, e.lineno); } catch (x) {} return; }
    showFatal(msg + (e.lineno ? ' (줄 ' + e.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', e => {
    if (RENDERED) return;
    showFatal(e.reason && e.reason.message || e.reason);
  });

  // 서버가 넣어 준 첫 화면 데이터 (JSON 블록)
  let INIT = null, VER = '';
  try {
    const el = document.getElementById('__init');
    if (el) { VER = el.getAttribute('data-ver') || ''; const t = el.textContent.trim(); if (t) INIT = JSON.parse(t); }
  } catch (e) { INIT = null; }

  let DATA = null, ADMIN = null, TAB = 'status';
  // 속도 측정 (화면 맨 아래 표시)
  const T0 = performance.now();
  const SPEED = { start: T0, first: null, data: null, server: null, cached: null, from: '' };
  let PIN = '';
  try { PIN = sessionStorage.getItem('tennis_pin') || ''; } catch (e) {}

  const $ = s => document.querySelector(s);
  const won = n => Math.abs(Number(n) || 0).toLocaleString('ko-KR');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const localToday = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const WD = ['일','월','화','수','목','금','토'];
  const parseD = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const fmtDate = s => { const d = parseD(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
  const fmtShort = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()} (${WD[d.getDay()]})`; };
  const fmtMD = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const fmtTime = t => String(t || '').replace('~', ' ~ ');
  const courtTxt = c => c ? (/코트/.test(c) ? c : `코트 ${c}`) : '';
  const dday = s => {
    const n = Math.round((parseD(s) - parseD(DATA.today || localToday())) / 86400000);
    return n === 0 ? '오늘' : n === 1 ? '내일' : `D-${n}`;
  };

  // Apps Script 화면이면 google.script.run, GitHub Pages면 fetch로 API 호출
  const IN_GAS = !!(window.google && google.script && google.script.run);
  function api(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (IN_GAS) {
      return new Promise((resolve, reject) => {
        const r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        r[fn].apply(r, args);
      });
    }
    const url = window.__API_URL__;
    const req = fn === 'getSummary'
      ? fetch(url + '?fn=getSummary&t=' + Date.now())
      : fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) });
    return req
      .then(r => { if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')'); return r.json(); })
      .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
      .catch(e => { throw new Error(e && e.message === 'Failed to fetch' ? '인터넷 연결을 확인하세요' : (e && e.message || e)); });
  }
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function errMsg(e) { return (e && e.message) ? e.message.replace(/^Error:\s*/, '') : String(e); }

  function amtHtml(b, charged) {
    if (b < 0) return `<div class="amt minus">${won(b)}원<small>낼 돈</small></div>`;
    if (b > 0) return `<div class="amt plus">${won(b)}원<small>남은 금액</small></div>`;
    return charged ? `<div class="amt done">✓ 정산 완료</div>` : `<div class="amt zero" style="font-size:14px">낼 돈 없음</div>`;
  }

  // ===== 데이터 로드 =====
  const LS_KEY = 'tennis_summary_' + VER;
  function saveLocal(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) {} }
  function readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }

  let LOADING = null, LAST_LOAD = 0;
  async function load(silent) {
    if (!silent && !DATA) $('#app').innerHTML = '<div class="loading">불러오는 중…</div>';
    document.body.classList.add('busy');
    LAST_LOAD = Date.now();
    try {
      const tReq = performance.now();
      DATA = await api('getSummary');
      if (SPEED.data == null) { SPEED.data = performance.now() - T0; SPEED.req = performance.now() - tReq; SPEED.server = DATA._ms; SPEED.cached = DATA._cached; }
      saveLocal(DATA);
      if (TAB === 'admin' && PIN) ADMIN = await api('getAdminData', PIN).catch(() => null);
      // 입력하는 중이면 다시 그리지 않음 (쓰던 내용이 지워지지 않게)
      const el = document.activeElement;
      const typing = silent && el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) && !$('#modal').classList.contains('show');
      if (!typing) safeRender(false);
    } catch (e) {
      if (silent && DATA) toast('새로고침 실패: ' + errMsg(e));   // 이미 화면이 있으면 그대로 두고 알림만
      else $('#app').innerHTML = `<div class="card">불러오기 실패: ${esc(errMsg(e))}</div>`;
    } finally {
      document.body.classList.remove('busy');
    }
  }

  // 탭 눌렀을 때 새로고침: 같은 탭 다시 누르면 바로, 다른 탭이면 5초 지난 경우만
  function refresh(force) {
    if (LOADING) return;
    if (!force && Date.now() - LAST_LOAD < 5000) return;
    LOADING = load(true).finally(() => { LOADING = null; });
  }

  function speedTxt() {
    const sec = ms => (ms / 1000).toFixed(1) + '초';
    const boot = performance.timing ? (performance.timing.navigationStart ? sec(Date.now() - performance.timing.navigationStart - (performance.now() - T0)) : '') : '';
    return `⏱ 페이지 준비 ${boot} · 첫 화면 ${sec(SPEED.first || 0)} · ${SPEED.from}` +
      (SPEED.data != null && SPEED.req != null ? ` · 데이터 요청 ${sec(SPEED.req)} (서버 계산 ${sec(SPEED.server || 0)}, ${SPEED.cached ? '캐시' : '새로 계산'})` : SPEED.cached ? ' · 캐시 데이터' : '');
  }

  // 저장본(예전 형식일 수 있음)으로 그리다 실패하면 버리고 새로 받아옴
  function safeRender(fromStored) {
    try { render(); return true; }
    catch (e) {
      if (fromStored) { DATA = null; try { localStorage.removeItem(LS_KEY); } catch (x) {} load(); }
      else showFatal(e && e.message || e);
      return false;
    }
  }

  function render() {
    if (SPEED.first == null) SPEED.first = performance.now() - T0;
    RENDERED = true;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
    if (!DATA) return;
    if (TAB === 'status') renderStatus();
    else if (TAB === 'meetings') renderMeetings();
    else if (TAB === 'monthly') renderMonthly();
    else renderAdmin();
  }

  // ===== 일정 표시 =====
  // ===== 송금 =====
  let IN_FRAME = true;
  try { IN_FRAME = window.top !== window.self; } catch (e) { IN_FRAME = true; }
  function copyText(t) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t); return true; } } catch (e) {}
    try {
      const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  function payBoxHtml(p) {
    const info = DATA.payInfo || {};
    const amt = Math.max(0, -p.balance);
    if (!amt) return '';
    const acct = String(info.account || '').replace(/[^0-9]/g, '');
    const SL = '/';   // Google이 문자열 안의 슬래시 두 개를 주석으로 지워서, 따로 붙임
    const toss = info.bank && acct ? `supertoss:${SL}${SL}send?bank=${encodeURIComponent(info.bank)}&accountNo=${acct}&amount=${amt}` : '';
    const has = toss || acct;
    return `
      <div class="paybox">
        <div class="ptop"><span>${esc(p.name)}님 낼 돈</span><b>${won(amt)}원</b></div>
        ${p.unpaid.length ? `<div class="muted">${p.unpaid.map(fmtMD).join(', ')}분</div>` : ''}
        ${p.reported ? `<div class="pwait">⏳ 송금 알림 보냄 · 총무 확인을 기다리는 중이에요</div>` : ''}
        ${has ? `<div class="muted" style="margin-top:10px;font-size:12px">송금 앱 선택</div><div class="pbtns" style="margin-top:4px">
          ${toss ? `<a class="pb toss" href="${toss}" target="${IN_FRAME ? '_blank' : '_self'}" rel="noopener" data-copy="${amt}" data-app="토스">토스</a>` : ''}
          ${acct ? `<a class="pb kbank" href="kakaobank:${SL}${SL}" target="${IN_FRAME ? '_blank' : '_self'}" data-kbank="${amt}">카카오뱅크</a>` : ''}
          ${acct ? `<button class="pb" data-copyacct="${amt}">계좌·금액 복사</button>` : ''}
        </div>
        ${acct ? `<div class="muted" style="margin-top:6px">${esc(info.bank)} ${esc(info.account)}${info.holder ? ' · ' + esc(info.holder) : ''}</div>
          <div class="muted" style="font-size:12px">카카오뱅크는 계좌번호가 복사된 채로 앱이 열려요. 이체에서 붙여넣고 금액만 입력하세요. 다른 은행 앱은 '계좌·금액 복사' 후 여세요.</div>` : ''}
        ${info.note ? `<div class="muted">${esc(info.note)}</div>` : ''}`
        : '<div class="muted" style="margin-top:6px">총무가 아직 송금 정보를 등록하지 않았어요.</div>'}
        ${p.reported
          ? `<button class="btn sub" style="margin-top:10px" data-unreport="${esc(p.name)}">송금 알림 취소</button>`
          : `<button class="btn" style="margin-top:10px" data-report="${esc(p.name)}">송금했어요</button>`}
      </div>`;
  }
  // 낼 돈 옆 버튼
  function payCol(x, amt) {
    if (x.balance >= 0) return amt;
    return `<div class="rcol">${amt}${x.reported
      ? `<button class="paytag" data-payopen="${esc(x.name)}">⏳ 확인 대기</button>`
      : `<button class="paybtn" data-payopen="${esc(x.name)}">송금하기</button>`}</div>`;
  }
  function openPay(name) {
    const p = DATA.people.find(x => x.name === name);
    if (!p) return;
    openModal(`<div class="head"><b>송금하기</b><button class="mini g" id="close">닫기</button></div>
      <div class="card">${payBoxHtml(p)}</div>`);
    $('#close').onclick = closeModal;
  }
  // 송금 버튼 / 송금했어요
  document.addEventListener('click', async e => {
    const po = e.target.closest('[data-payopen]');
    if (po) { e.stopPropagation(); openPay(po.dataset.payopen); return; }
    const c = e.target.closest('[data-copy]');
    if (c) {
      copyText(String(c.dataset.copy));
      toast(`${c.dataset.app}를 여는 중…`);
      // 1.5초 안에 앱으로 안 넘어가면(화면이 계속 보이면) 안내
      const app = c.dataset.app;
      let left = false;
      const onHide = () => { if (document.hidden) left = true; };
      document.addEventListener('visibilitychange', onHide);
      window.addEventListener('blur', () => { left = true; }, { once: true });
      setTimeout(() => {
        document.removeEventListener('visibilitychange', onHide);
        if (!left) toast(`${app} 앱이 안 열렸어요. 아래 '계좌·금액 복사'를 눌러 은행 앱에서 보내 주세요`);
      }, 1500);
      return;   // 링크 이동(새 창)은 그대로 진행
    }
    const kb = e.target.closest('[data-kbank]');
    if (kb) {
      // 카카오뱅크는 계좌·금액을 넣어 여는 링크가 없어서: 계좌번호를 복사해 두고 앱만 엶
      const info = DATA.payInfo || {};
      copyText(`${info.bank} ${info.account}`);
      toast(`계좌를 복사했어요. 카카오뱅크에서 이체 → 붙여넣기, 금액 ${won(kb.dataset.kbank)}원 입력`);
      return;   // 링크 이동(앱 열기)은 그대로 진행
    }
    const ca = e.target.closest('[data-copyacct]');
    if (ca) {
      const info = DATA.payInfo || {};
      const ok = copyText(`${info.bank} ${info.account} ${won(ca.dataset.copyacct)}원`);
      toast(ok ? '계좌와 금액을 복사했어요. 은행 앱에 붙여넣으세요' : '복사가 안 됐어요. 계좌번호를 길게 눌러 복사하세요');
      return;
    }
    const u = e.target.closest('[data-unreport]');
    if (u) {
      e.stopPropagation();
      if (!confirm('송금 알림을 취소할까요? 다시 낼 돈 상태로 돌아가요.')) return;
      u.disabled = true;
      try {
        await api('cancelReport', u.dataset.unreport);
        toast('송금 알림을 취소했어요');
        closeModal();
        await load(true);
      } catch (err) { toast(errMsg(err)); u.disabled = false; }
      return;
    }
    const r = e.target.closest('[data-report]');
    if (!r) return;
    e.stopPropagation();
    if (!confirm('송금을 마쳤나요? 총무에게 확인 요청이 가요.')) return;
    r.disabled = true;
    try {
      await api('reportPayment', r.dataset.report);
      toast('송금 알림을 보냈어요. 총무가 확인하면 ✓로 바뀌어요');
      closeModal();
      await load(true);
    } catch (err) { toast(errMsg(err)); r.disabled = false; }
  }, true);

  // ===== 참석 투표 =====
  let ME = '';
  try { ME = localStorage.getItem('tennis_me') || ''; } catch (e) {}
  const canVote = m => m.status === '예정' && m.date >= (DATA.today || localToday());

  function voteHtml(m, onHero) {
    const v = m.votes || { yes: [], no: [] };
    const active = DATA.members.filter(x => x.active).map(x => x.name);
    const none = active.filter(n => v.yes.indexOf(n) < 0 && v.no.indexOf(n) < 0);
    const mine = v.yes.indexOf(ME) >= 0 ? '참석' : v.no.indexOf(ME) >= 0 ? '불참' : '';
    const meOk = ME && active.indexOf(ME) >= 0;
    return `
      <div class="vote ${onHero ? 'onhero' : ''}">
        <div class="vhead">참석 투표 <span>참석 <b>${v.yes.length}</b> · 불참 ${v.no.length} · 미응답 ${none.length}</span></div>
        ${v.yes.length ? `<div class="vnames">🙋 ${v.yes.map(esc).join(', ')}</div>` : ''}
        ${v.no.length ? `<div class="vnames dim">🙅 ${v.no.map(esc).join(', ')}</div>` : ''}
        ${meOk ? `
          <div class="vbtns">
            <button class="vb ${mine === '참석' ? 'on' : ''}" data-vote="${esc(m.id)}" data-c="참석">참석</button>
            <button class="vb no ${mine === '불참' ? 'on' : ''}" data-vote="${esc(m.id)}" data-c="불참">불참</button>
          </div>
          <div class="vme">${esc(ME)}님으로 투표 중 · <button class="linkbtn" data-me="1">이름 바꾸기</button></div>`
        : `<button class="vb wide" data-me="1">내 이름 선택하고 투표하기</button>`}
      </div>`;
  }

  function pickMe() {
    const names = DATA.members.filter(x => x.active).map(x => x.name);
    openModal(`
      <div class="head"><b>내 이름 선택</b><button class="mini g" id="close">닫기</button></div>
      <div class="card"><div class="muted" style="margin-bottom:10px">이 휴대폰에 저장돼서 다음부터는 바로 투표할 수 있어요.</div>
        <div class="checks">${names.map(n => `<label class="${n === ME ? 'on' : ''}" data-pickme="${esc(n)}">${esc(n)}</label>`).join('')}</div>
      </div>`);
    $('#close').onclick = closeModal;
    document.querySelectorAll('[data-pickme]').forEach(el => el.onclick = () => {
      ME = el.dataset.pickme;
      try { localStorage.setItem('tennis_me', ME); } catch (e) {}
      closeModal(); render();
    });
  }

  let voting = false;
  document.addEventListener('click', async e => {
    if (e.target.closest('[data-me]')) { e.stopPropagation(); pickMe(); return; }
    const b = e.target.closest('[data-vote]');
    if (!b || voting) return;
    e.stopPropagation();
    const mid = b.dataset.vote, m = DATA.upcoming.find(x => x.id === mid);
    if (!m) return;
    const v = m.votes;
    const cur = v.yes.indexOf(ME) >= 0 ? '참석' : v.no.indexOf(ME) >= 0 ? '불참' : '';
    const choice = cur === b.dataset.c ? '' : b.dataset.c;   // 같은 버튼 다시 누르면 취소
    // 화면 먼저 바꾸고 서버 저장
    v.yes = v.yes.filter(n => n !== ME); v.no = v.no.filter(n => n !== ME);
    if (choice === '참석') v.yes.push(ME); else if (choice === '불참') v.no.push(ME);
    render();
    voting = true;
    try {
      await api('vote', mid, ME, choice);
      toast(choice ? `${choice}으로 투표했어요` : '투표를 취소했어요');
      await load(true);
    } catch (err) { toast(errMsg(err)); await load(true); }
    finally { voting = false; }
  }, true);

  function heroHtml(m) {
    const where = [m.time ? '🕖 ' + esc(fmtTime(m.time)) : '', m.court ? esc(courtTxt(m.court)) : '', m.place ? '📍 ' + esc(m.place) : '']
      .filter(Boolean).join(' <span class="hdot">·</span> ');
    return `
      <div class="hero" data-goto="${esc(m.id)}">
        <div class="htop"><span class="hdate">${fmtDate(m.date)}</span><span class="dday">${dday(m.date)}</span></div>
        <div class="hrow">${where}</div>
        ${m.memo ? `<div class="hmemo">📝 ${esc(m.memo)}</div>` : ''}
        ${m.status === '정산' && m.count ? `
          <div class="hpay"><span>참석 ${m.count}명 · 1인당 <b>${won(m.per)}원</b></span>
            <span class="hchips">${m.attendees.map((a, i) => chip(m, i, true)).join('')}</span></div>
          <div class="hlegend"><i class="lg pre"></i>선불 차감 <i class="lg ok"></i>✓ 납부 <i class="lg wait"></i>⏳ 확인 중 <i class="lg no"></i>미납</div>` : ''}
        ${canVote(m) ? voteHtml(m, true) : ''}
      </div>`;
  }
  // 참석자 + 1인당 + 납부 여부
  function chipsHtml(m) {
    return `<div class="chips">${m.attendees.map((a, i) => chip(m, i, false)).join('')}</div>`;
  }
  // 참석자 칩: paid(✓ 납부) / prepaid(선불 차감) / unpaid(미납). 관리자는 paid·unpaid를 눌러 확인/취소
  function chip(m, i, onHero) {
    const st = m.pay[i], n = m.attendees[i];
    const tap = PIN && st !== 'prepaid' ? ` data-pay="${esc(m.id)}" data-name="${esc(n)}" data-st="${st}" data-per="${m.per}" role="button"` : '';
    const label = st === 'paid' ? `✓ ${esc(n)}` : st === 'prepaid' ? `${esc(n)} <small>선불 −${won(m.per)}</small>` : st === 'reported' ? `⏳ ${esc(n)}` : esc(n);
    if (onHero) {
      const short = st === 'paid' ? `✓${esc(n)}` : st === 'reported' ? `⏳${esc(n)}` : esc(n);
      return `<span class="hchip ${st === 'paid' ? 'ok' : st === 'prepaid' ? 'pre' : st === 'reported' ? 'wait' : ''}${tap ? ' tap' : ''}"${tap} title="${st === 'prepaid' ? '선불 차감' : st === 'paid' ? '납부 완료' : st === 'reported' ? '송금 확인 대기' : '미납'}">${short}</span>`;
    }
    return `<span class="chip ${st}${tap ? ' tap' : ''}"${tap}>${label}</span>`;
  }
  function payLine(m) {
    if (m.status !== '정산' || !m.count) return '';
    return `${m.count}명 · 1인당 <b>${won(m.per)}원</b> ` +
      (m.paidCount === m.count ? '<span class="chip paid">✓ 전원 정산</span>' : `<span class="muted">· 납부 ${m.paidCount}/${m.count}명</span>`);
  }
  function meetCard(x, showDday) {
    return `
        <div class="card meet" id="meet-${esc(x.id)}">
          <div class="top"><span class="date">${fmtShort(x.date)}</span>${showDday ? `<span class="dday" style="background:var(--accent2)">${dday(x.date)}</span>` : `<span class="muted">대관료 ${won(x.fee)}원</span>`}</div>
          <div class="muted" style="margin-top:2px">${esc(x.place)}${x.court ? ' · ' + esc(courtTxt(x.court)) : ''}${x.time ? ' · ' + esc(fmtTime(x.time)) : ''}</div>
          ${x.status === '정산' ? `<div style="margin-top:6px">${payLine(x)}</div>${chipsHtml(x)}` : canVote(x) ? voteHtml(x, false) : '<div class="muted" style="margin-top:6px">참석자 미정</div>'}
        </div>`;
  }
  // 일정 줄 오른쪽: 참석자 미정이면 바로 투표, 아니면 ›
  function rowVote(m) {
    if (!canVote(m)) return '<span class="muted">›</span>';
    const v = m.votes || { yes: [], no: [] };
    const active = DATA.members.filter(x => x.active).map(x => x.name);
    const cnt = `<span class="vcnt">🙋 ${v.yes.length}</span>`;
    if (!(ME && active.indexOf(ME) >= 0)) return `<div class="rvote">${cnt}<button class="rvb" data-me="1">투표하기</button></div>`;
    const mine = v.yes.indexOf(ME) >= 0 ? '참석' : v.no.indexOf(ME) >= 0 ? '불참' : '';
    return `<div class="rvote">${cnt}
      <button class="rvb ${mine === '참석' ? 'on' : ''}" data-vote="${esc(m.id)}" data-c="참석">참석</button>
      <button class="rvb no ${mine === '불참' ? 'on' : ''}" data-vote="${esc(m.id)}" data-c="불참">불참</button></div>`;
  }

  function schedRow(m, extra, gotoId) {
    return `
      <div class="row"${gotoId ? ` data-goto="${esc(gotoId)}" style="cursor:pointer"` : ''}>
        <div class="sdate">${fmtShort(m.date)}</div>
        <div class="sinfo">${esc(m.place)}${m.court ? ' · ' + esc(courtTxt(m.court)) : ''}
          <div class="muted">${esc(fmtTime(m.time))}${m.memo ? ' · ' + esc(m.memo) : ''}${m.status === '정산' ? ` · 참석 ${m.count}명 · ${won(m.per)}원` : ''}</div></div>
        ${extra || ''}
      </div>`;
  }

  // ===== 현황 =====
  function renderStatus() {
    const up = DATA.upcoming;
    // 선불 회원 / 일반 회원 나눠서 표시
    const pre = DATA.people.filter(x => x.prepaid).sort((a, b) => a.balance - b.balance || a.name.localeCompare(b.name, 'ko'));
    // 정산 현황에 보일 사람: 다가오는 일정·가장 최근 모임 참석자 + 낼 돈/적립금이 남은 사람
    const involved = {};
    DATA.upcoming.concat((DATA.past || []).slice(0, 1)).forEach(m => m.attendees.forEach(n => involved[n] = true));
    const grp = b => b < 0 ? 0 : 2;
    const byBal = (a, b) => grp(a.balance) - grp(b.balance) || a.balance - b.balance || a.name.localeCompare(b.name, 'ko');
    const rest = DATA.people.filter(x => !x.prepaid);
    const p = rest.filter(x => x.balance !== 0 || involved[x.name]).sort(byBal);
    const others = rest.filter(x => !(x.balance !== 0 || involved[x.name])).sort(byBal);
    const owe = DATA.people.filter(x => x.balance < 0).reduce((s, x) => s + x.balance, 0);
    const unpaidTxt = x => x.unpaid && x.unpaid.length ? `<div class="muted ${x.reported ? 'wait' : 'minus'}">${x.unpaid.map(fmtMD).join(', ')}분 ${x.reported ? '송금 확인 대기' : '미납'}</div>` : '';

    const meP = ME && DATA.people.find(x => x.name === ME);

  function goToMeeting(id) {

  // ===== 일정 탭 =====
  function renderMeetings() {
    const up = DATA.upcoming, done = DATA.past || [];
    $('#app').innerHTML = `

  // ===== 월별 (달력 + 정산) =====
  let MONTH = '', PICK = '';
  function allMeetings() {
    const seen = {}, out = [];
    [].concat(DATA.upcoming || [], DATA.settled || [], DATA.pending || [], DATA.past || []).forEach(m => {
      if (!seen[m.id]) { seen[m.id] = 1; out.push(m); }
    });
    return out;
  }
  const ymAdd = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

  function calendarHtml(ym, byDate, today) {
    const y = Number(ym.slice(0, 4)), mo = Number(ym.slice(5)) - 1;
    const first = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < first; i++) cells += '<div class="cd empty"></div>';
    for (let d = 1; d <= days; d++) {
      const ds = ym + '-' + String(d).padStart(2, '0');
      const ms = byDate[ds] || [];
      const wd = (first + d - 1) % 7;
      let mark = '';
      if (ms.length) {
        const unpaid = ms.reduce((s, m) => s + (m.status === '정산' ? m.count - m.paidCount : 0), 0);
        const vote = ms.some(m => m.status === '예정');
        const yes = ms.reduce((s, m) => s + (m.status === '예정' && m.votes ? m.votes.yes.length : 0), 0);
        mark = vote ? `<span class="cm vt">🙋${yes}</span>`
          : unpaid ? `<span class="cm due">${unpaid}</span>` : '<span class="cm ok">✓</span>';
      }
      cells += `<div class="cd${ms.length ? ' has' : ''}${ds === today ? ' today' : ''}${ds === PICK ? ' pick' : ''}${wd === 0 ? ' sun' : wd === 6 ? ' sat' : ''}"${ms.length ? ` data-day="${ds}"` : ''}>
        <span class="dn">${d}</span>${mark}</div>`;
    }
    return `<div class="cal">${['일', '월', '화', '수', '목', '금', '토'].map((w, i) => `<div class="cw${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('')}${cells}</div>`;
  }

  function renderMonthly() {
    const today = DATA.today || localToday();
    const list = DATA.monthly || [];
    if (!MONTH) MONTH = today.slice(0, 7);
    const byDate = {};
    allMeetings().forEach(m => { if (m.date.slice(0, 7) === MONTH) (byDate[m.date] = byDate[m.date] || []).push(m); });
    const g = list.find(x => x.ym === MONTH);
    const ymTxt = ym => `${ym.slice(0, 4)}년 ${Number(ym.slice(5))}월`;
    const picked = PICK && PICK.slice(0, 7) === MONTH ? (byDate[PICK] || []) : [];

    $('#app').innerHTML = `
      <div class="card" style="padding:10px 10px 8px">
        <div class="calhead">
          <button class="mini g" id="mPrev">◀</button><b>${ymTxt(MONTH)}</b><button class="mini g" id="mNext">▶</button>
        </div>
        ${calendarHtml(MONTH, byDate, today)}
        <div class="callegend"><span class="cm ok">✓</span>전원 납부 <span class="cm due lg-blank"></span>미납 인원 수 <span class="cm vt">🙋</span>투표 중 (참석 인원 수)</div>
      </div>
      ${picked.length ? picked.map(m => meetCard(m, m.date >= today)).join('')
        : Object.keys(byDate).length ? '<div class="muted" style="text-align:center;margin:-2px 0 10px">날짜를 누르면 그날 일정이 보여요</div>' : ''}

      ${g ? `
      <div class="stats" style="margin-bottom:10px">
        <div class="stat"><div class="l">모임</div><div class="v">${g.meetings.length}회</div></div>
        <div class="stat"><div class="l">대관료 합계</div><div class="v">${won(g.fee)}원</div></div>
      </div>
      <div class="stats" style="margin-bottom:12px">
        <div class="stat"><div class="l">받은 돈 (납부·선불)</div><div class="v plus">${won(g.collected)}원</div></div>
        <div class="stat"><div class="l">미납</div><div class="v ${g.unpaid ? 'minus' : 'zero'}">${won(g.unpaid)}원</div></div>
      </div>
      ${g.charged - g.fee ? `<div class="muted" style="margin:-4px 4px 10px">1/N 올림으로 생긴 차액 ${won(g.charged - g.fee)}원 (청구 ${won(g.charged)}원 − 대관료 ${won(g.fee)}원)</div>` : ''}
      <div class="sec">사람별</div>
      <div class="card list">
        ${g.people.map(p => `
          <div class="row" style="cursor:default">
            <div><div class="name" style="font-size:15px">${esc(p.name)}</div>
              <div class="muted">${p.count}회 참석 · ${won(p.amount)}원${p.prepaid ? ` (선불 ${won(p.prepaid)}원)` : ''}</div></div>
            ${p.unpaid ? `<div class="amt minus" style="font-size:15px">${won(p.unpaid)}원<small>미납</small></div>` : '<div class="amt done" style="font-size:14px">✓ 완료</div>'}
          </div>`).join('')}
      </div>` : '<div class="card muted">이 달에는 정산된 모임이 없어요.</div>'}`;

    $('#mPrev').onclick = () => { MONTH = ymAdd(MONTH, -1); PICK = ''; renderMonthly(); };
    $('#mNext').onclick = () => { MONTH = ymAdd(MONTH, 1); PICK = ''; renderMonthly(); };
    document.querySelectorAll('.cd[data-day]').forEach(el => el.onclick = () => {
      PICK = PICK === el.dataset.day ? '' : el.dataset.day; renderMonthly();
    });
  }

        </div>
        <label>계좌번호</label><input id="iAcct" inputmode="numeric" value="${esc(info.account)}" placeholder="예) 123456-78-901234">
        <label>안내 문구 (선택)</label><input id="iNote" value="${esc(info.note)}" placeholder="예) 입금자명은 본인 이름으로">
        <div class="muted" style="margin-top:6px">은행은 '국민', '신한', '카카오뱅크', '토스뱅크'처럼 짧게 쓰면 토스 송금 화면이 잘 열려요.</div>
        <button class="btn" id="iBtn">저장</button>
      </div>

      ${ADMIN.sheetUrl ? `<div class="card"><h2>데이터 시트</h2>
        <div class="muted">이 앱의 데이터는 <b>${esc(ADMIN.sheetName)}</b> 스프레드시트의 <b>회원 · 모임 · 거래</b> 탭에 저장돼요.</div>
        <a class="btn sub" style="text-align:center;text-decoration:none" href="${esc(ADMIN.sheetUrl)}" target="_blank">📄 데이터 시트 열기</a></div>` : ''}

      <button class="btn sub" id="logout">관리자 로그아웃</button>`;

    // 일정 등록
    const sChecks = [...document.querySelectorAll('#app .checks input')];
    $('#sAll').onclick = bindPicker(sChecks, $('#sFee'), $('#sPrev'), '참석자 미정 · 청구 없이 일정만 등록돼요');
    $('#sBtn').onclick = busy(async () => {
      const t1v = $('#sT1').value, t2v = $('#sT2').value;
      const r = await api('addSchedule', PIN, {
        attendees: sChecks.filter(c => c.checked).map(c => c.value),
        date: $('#sDate').value, repeat: $('#sRepeat').value,
        time: t1v ? (t1v + '~' + (t2v || '')) : '',
        place: $('#sPlace').value, court: $('#sCourt').value, fee: $('#sFee').value, memo: $('#sMemo').value
      });
      toast(r.per ? `일정 ${r.count}개 등록 · 1인당 ${won(r.per)}원 청구` : `일정 ${r.count}개 등록 완료`);
    });
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
    document.querySelectorAll('[data-editinfo]').forEach(b => b.onclick = () => openEdit(b.dataset.editinfo, true));

    // 입금
    const pMap = {}; DATA.people.forEach(p => pMap[p.name] = p);
    $('#pName').onchange = () => {
      const x = pMap[$('#pName').value];
      $('#pBal').innerHTML = !x ? '' : x.prepaid
        ? `현재 선불 잔액 <b class="${x.balance < 0 ? 'minus' : 'plus'}">${x.balance < 0 ? '−' : ''}${won(x.balance)}원</b>`
        : x.balance < 0 ? `지금 낼 돈 <b class="minus">${won(x.balance)}원</b>이 있어요. 충전하면 이 금액부터 채워져요.` : '선불 충전 기록이 없어요.';
    };
    $('#pBtn').onclick = busy(async () => {
      await api('addPayment', PIN, { name: $('#pName').value, amount: $('#pAmt').value, date: $('#pDate').value, memo: $('#pMemo').value });
      toast('선불 충전 완료');
    });

    // 회원
    $('#nBtn').onclick = busy(async () => { await api('addMember', PIN, $('#nName').value); toast('회원 추가 완료'); });
    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = busy(async () => {
      await api('setMemberActive', PIN, b.dataset.toggle, b.dataset.active !== '1');
    }));

    // 삭제
    document.querySelectorAll('[data-unsettle]').forEach(b => b.onclick = busy(async () => {
      if (!confirm('정산을 취소할까요? 이 모임의 청구가 지워지고 예정 일정으로 돌아가요.')) throw null;
      await api('unsettleMeeting', PIN, b.dataset.unsettle); toast('정산을 취소했어요');
    }));
    document.querySelectorAll('[data-delpay]').forEach(b => b.onclick = busy(async () => {
      if (!confirm('이 입금 기록을 삭제할까요?')) throw null;
      await api('deletePayment', PIN, b.dataset.delpay); toast('삭제했어요');
    }));
    document.querySelectorAll('[data-delmeet]').forEach(b => b.onclick = busy(async () => {
      if (!confirm('이 일정을 삭제할까요? (정산된 경우 청구도 같이 취소돼요)')) throw null;
      await api('deleteMeeting', PIN, b.dataset.delmeet); toast('삭제했어요');
    }));

    $('#iBtn').onclick = busy(async () => {
      await api('setPayInfo', PIN, { bank: $('#iBank').value, account: $('#iAcct').value, holder: $('#iHolder').value, kakao: '', note: $('#iNote').value });
      toast('송금 정보를 저장했어요');
    });
    document.querySelectorAll('[data-okrep]').forEach(b => b.onclick = busy(async () => {
      const n = await api('confirmReported', PIN, b.dataset.okrep);
      toast(`${b.dataset.okrep}님 ${n}건 납부 확인`);
    }));
    document.querySelectorAll('[data-norep]').forEach(b => b.onclick = busy(async () => {
      if (!confirm(`${b.dataset.norep}님 송금 알림을 반려할까요? (입금이 안 들어왔을 때)`)) throw null;
      await api('rejectReport', PIN, b.dataset.norep); toast('반려했어요');
    }));

    $('#logout').onclick = logout;
  }

  function openSettle(id) {
    const m = DATA.pending.find(x => x.id === id);
    if (!m) return;
    const active = DATA.members.filter(x => x.active);
    openModal(`
      <div class="head"><b>${fmtShort(m.date)} 정산</b><button class="mini g" id="close">닫기</button></div>
      <div class="card">
        <div class="muted">${esc(m.place)}${m.court ? ' · ' + esc(courtTxt(m.court)) : ''}${m.time ? ' · ' + esc(fmtTime(m.time)) : ''}</div>
        <label>대관료 총액</label><input id="xFee" type="number" inputmode="numeric" value="${m.fee || ''}" placeholder="예) 80000">
        <label>참석자 <button class="linkbtn" id="allBtn" style="float:right">전체 선택</button></label>
        <div class="checks">${active.map(x => `<label><input type="checkbox" value="${esc(x.name)}">${esc(x.name)}</label>`).join('') || '<span class="muted">회원을 먼저 추가하세요</span>'}</div>
        <div class="preview" id="xPrev">참석자를 선택하세요</div>
        <button class="btn" id="xBtn">정산하기</button>
      </div>`);
    $('#close').onclick = closeModal;

    const checks = [...document.querySelectorAll('#modalBody .checks input')];
    $('#allBtn').onclick = bindPicker(checks, $('#xFee'), $('#xPrev'));
    $('#xBtn').onclick = busy(async () => {
      const r = await api('settleMeeting', PIN, id, { fee: $('#xFee').value, attendees: checks.filter(c => c.checked).map(c => c.value) });
      closeModal();
      toast(`정산 완료 · 1인당 ${won(r.per)}원`);
    });
  }

  // 참석자 체크 + 1인당 미리보기
  function bindPicker(checks, feeEl, prevEl, emptyText) {
    const unit = DATA.roundUnit || 1;
    const upd = () => {
      checks.forEach(c => c.parentElement.classList.toggle('on', c.checked));
      const n = checks.filter(c => c.checked).length;
      const fee = Number(feeEl.value) || 0;
      if (!n || !fee) { prevEl.textContent = n ? `${n}명 선택됨 · 대관료를 입력하세요` : (emptyText || '참석자를 선택하세요'); return; }
      const per = Math.ceil(fee / n / unit) * unit;
      const diff = per * n - fee;
      prevEl.innerHTML = `${n}명 · 1인당 <b>${won(per)}원</b>${diff ? ` <span class="muted">(올림으로 ${won(diff)}원 남음)</span>` : ''}`;
    };
    checks.forEach(c => c.onchange = upd);
    feeEl.oninput = upd;
    upd();
    return () => { const all = checks.every(c => c.checked); checks.forEach(c => c.checked = !all); upd(); };
  }

  function openEdit(id, infoOnly) {
    const m = DATA.upcoming.concat(DATA.pending, DATA.settled).find(x => x.id === id);
    if (!m) return;
    const settled = m.status === '정산';
    const [t1, t2] = String(m.time || '').split('~');
    // 숨긴 회원이라도 이미 참석자면 목록에 표시
    const names = DATA.members.filter(x => x.active).map(x => x.name);
    const voteYes = !settled && m.votes ? m.votes.yes : [];
    const pre = settled ? m.attendees : voteYes;
    pre.forEach(a => { if (names.indexOf(a) < 0) names.push(a); });
    openModal(`
      <div class="head"><b>${fmtShort(m.date)} ${infoOnly ? '일정 정보 수정' : settled ? '일정 수정' : '참석자 지정'}</b><button class="mini g" id="close">닫기</button></div>
      <div class="card">
        <label>날짜</label><input id="eDate" type="date" value="${esc(m.date)}">
        <div class="inline">
          <div><label>시작</label><input id="eT1" type="time" value="${esc(t1 || '')}"></div>
          <div><label>종료</label><input id="eT2" type="time" value="${esc(t2 || '')}"></div>
        </div>
        <label>테니스장 위치</label><input id="ePlace" value="${esc(m.place)}">
        <div class="inline">
          <div><label>코트</label><input id="eCourt" value="${esc(m.court)}"></div>
          <div><label>대관료</label><input id="eFee" type="number" inputmode="numeric" value="${m.fee || ''}"></div>
        </div>
        <label>메모</label><input id="eMemo" value="${esc(m.memo)}">
        ${infoOnly ? '<div class="muted" style="margin-top:8px">참석자와 투표는 그대로 두고 정보만 바꿔요.</div>' : `
        <label>참석자 <button class="linkbtn" id="eAll" style="float:right">전체 선택</button></label>
        ${voteYes.length ? `<div class="muted" style="margin-bottom:6px">🙋 투표에서 참석한 ${voteYes.length}명이 미리 체크돼 있어요.</div>` : ''}
        <div class="checks">${names.map(n => `<label><input type="checkbox" value="${esc(n)}" ${pre.indexOf(n) >= 0 ? 'checked' : ''}>${esc(n)}</label>`).join('')}</div>
        <div class="preview" id="ePrev"></div>
        <div class="muted" style="margin-top:6px">${settled ? '저장하면 이 모임 청구가 새 금액·참석자로 다시 계산돼요. 입금 기록은 그대로예요. 참석자를 모두 빼면 청구가 취소돼요.' : '참석자를 고르면 그 사람들에게 1인당 금액이 청구돼요.'}</div>`}
        <div class="err"></div>
        <button class="btn" id="eBtn">저장</button>
      </div>`);
    $('#close').onclick = closeModal;
    const checks = [...document.querySelectorAll('#modalBody .checks input')];
    if (!infoOnly) $('#eAll').onclick = bindPicker(checks, $('#eFee'), $('#ePrev'), '참석자 미정 · 청구 없음');
    $('#eBtn').onclick = busy(async () => {
      const t1v = $('#eT1').value, t2v = $('#eT2').value;
      const r = await api('updateMeeting', PIN, id, {
        date: $('#eDate').value, time: t1v ? (t1v + '~' + (t2v || '')) : '',
        place: $('#ePlace').value, court: $('#eCourt').value, fee: $('#eFee').value, memo: $('#eMemo').value,
        attendees: infoOnly ? undefined : checks.filter(c => c.checked).map(c => c.value)
      });
      closeModal();
      toast(r.settled && !r.infoOnly ? `저장 완료 · 1인당 ${won(r.per)}원` : '저장 완료');
    });
  }

  // 참석자 칩 눌러서 납부 확인 / 취소 (관리자만)
  let paying = false;
  document.addEventListener('click', async e => {
    const c = e.target.closest('[data-pay]');
    if (!c || !PIN || paying) return;
    e.stopPropagation();
    const name = c.dataset.name, per = Number(c.dataset.per), paid = c.dataset.st === 'paid';
    if (!confirm(paid ? `${name}님 납부 확인을 취소할까요?` : `${name}님 ${won(per)}원 납부 확인할까요?`)) return;
    paying = true; c.style.opacity = .5;
    try {
      await api(paid ? 'cancelPayment' : 'confirmPayment', PIN, c.dataset.pay, name);
      toast(paid ? '납부 확인을 취소했어요' : `${name}님 납부 확인`);
      await load(true);
    } catch (err) { toast(errMsg(err)); c.style.opacity = 1; }
    finally { paying = false; }
  }, true);

  function logout() { PIN = ''; ADMIN = null; try { sessionStorage.removeItem('tennis_pin'); } catch (e) {} render(); }

  // 버튼 중복 클릭 방지 + 저장 후 새로고침
  function busy(fn) {
    return async function (ev) {
      const btn = ev.currentTarget; if (btn.disabled) return;
      btn.disabled = true;
      const errEl = document.querySelector('#modal.show .err');
      if (errEl) errEl.textContent = '';
      try { await fn(); await load(true); }
      catch (e) {
        if (!e) return;
        toast(errMsg(e));
        if (errEl) errEl.textContent = '⚠ ' + errMsg(e);
      }
      finally { btn.disabled = false; }
    };
  }

  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    const same = TAB === b.dataset.tab;
    TAB = b.dataset.tab;
    if (!same) { render(); window.scrollTo(0, 0); }   // 지금 데이터로 먼저 보여주고
    refresh(same);                                     // 뒤에서 최신 데이터 받아오기
  });
  // ===== 홈 화면에 추가 안내 =====
  (function homeScreenHint() {
    if (IN_GAS) return;
    const ua = navigator.userAgent;
    const standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (standalone) return;                                  // 이미 홈 화면 앱으로 열림
    let until = 0;
    try { until = Number(localStorage.getItem('tennis_a2hs_off') || 0); } catch (e) {}
    if (Date.now() < until) return;                          // 닫은 지 2주 안 됨
    const isIOS = /iPhone|iPad|iPod/.test(ua);
    const isKakao = /KAKAOTALK/i.test(ua);
    const bar = document.createElement('div');
    bar.id = 'a2hs';
    const close = '<button class="a2x" aria-label="닫기">✕</button>';
    const show = html => { bar.innerHTML = '<div class="a2ico"></div><div class="a2t">' + html + '</div>' + close; document.body.appendChild(bar);
      bar.querySelector('.a2x').onclick = () => { bar.remove(); try { localStorage.setItem('tennis_a2hs_off', Date.now() + 14 * 864e5); } catch (e) {} }; };
    const isSamsung = /SamsungBrowser/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    if (isKakao) {
      show('<b>홈 화면에 앱처럼 추가하려면</b><br>' + (isIOS
        ? '오른쪽 아래 <b>⋯</b> → <b>Safari로 열기</b> 후 다시 해 주세요'
        : '오른쪽 위 <b>⋮</b> → <b>다른 브라우저로 열기</b> 후 다시 해 주세요'));
    } else if (isIOS) {
      show('<b>아이폰 홈 화면에 추가하기</b><br><b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b> → <b>추가</b><br><span style="opacity:.75">공유 버튼이 안 보이면 <b>⋯</b> → <b>공유</b></span>');
    } else if (isAndroid) {
      // 크롬은 [설치하기] 버튼, 안 되면 직접 하는 방법 안내
      let prompted = false;
      window.addEventListener('beforeinstallprompt', ev => {
        ev.preventDefault(); prompted = true;
        if (bar.parentNode) bar.remove();
        show('<b>갤럭시 홈 화면에 추가하기</b><br><button class="a2go">설치하기</button>');
        bar.querySelector('.a2go').onclick = () => { ev.prompt(); bar.remove(); };
      });
      setTimeout(() => {
        if (prompted) return;
        show('<b>갤럭시 홈 화면에 추가하기</b><br>' + (isSamsung
          ? '아래 <b>메뉴(≡)</b> → <b>현재 페이지 추가</b> → <b>홈 화면</b>'
          : '오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b> (또는 <b>앱 설치</b>) → <b>추가</b>'));
      }, 2500);
    }
  })();

  // 시작: 페이지에 같이 온 데이터 → 바로 표시. 없으면 휴대폰에 저장된 마지막 화면 → 표시 후 새로고침
  (function start() {
    if (INIT) {
      DATA = INIT; SPEED.from = '페이지에 포함'; SPEED.data = 0; SPEED.cached = true;
      if (safeRender(true)) saveLocal(DATA);
      return;
    }
    const cached = readLocal();
    if (cached) { DATA = cached; SPEED.from = '휴대폰 저장본 먼저'; if (safeRender(true)) load(true); }
    else { SPEED.from = '저장본 없음'; load(); }
  })();
</script>
</body>
</html>
